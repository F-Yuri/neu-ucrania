# Deploy: Cloudflare Pages. A env var HUGO_VERSION precisa estar setada em AMBOS os
# ambientes (Production E Preview) em Settings → Environment variables — não é óbvio
# e sem isso o Cloudflare cai num Hugo antigo (0.121.0 detectado em ago/2026) que não
# suporta funções usadas aqui (ex.: hugo.Data) e quebra o build. Vale pra qualquer
# outro projeto Hugo no Cloudflare Pages (ex.: NPSeD).
baseURL = "https://www.neu-ucrania.org/"
locale = "pt-BR"
title = "NEU — Pesquisa sobre a Ucrânia no Brasil | USP"
enableRobotsTXT = true
enableGitInfo = false

# Gera sumários automáticos
summaryLength = 30

[params]
  description = "Pesquisa interdisciplinar sobre a Ucrânia reunindo pesquisadores brasileiros e europeus. USP — Departamento de Ciência Política."
  email = "neucrania@gmail.com"
  instituicao = "Departamento de Ciência Política — USP"
  fundacao = "2024"
  twitter = ""
  instagram = ""

[taxonomies]
  tema = "temas"

[outputs]
  home = ["HTML"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[minify]
  minifyOutput = true

  # rebuild abril 2026

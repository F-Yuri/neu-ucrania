media:
  - name: uploads
    input: static/assets/img
    output: /assets/img

content:
  - name: conteudo
    label: "Conteúdo do Dia a Dia"
    type: group
    items:
      - name: eventos
        label: Eventos
        type: collection
        path: content/eventos
        filename: "{fields.data}-{fields.title}.md"
        operations:
          delete: false
        fields:
          - { name: title, label: "Título", type: string }
          - { name: data, label: "Data", type: date }
          - name: tipo
            label: "Tipo"
            type: select
            options:
              values: [coloquio, conferencia, congresso, live, painel, palestra]
          - { name: local, label: "Local", type: string }
          - name: status
            label: "Status"
            type: select
            options:
              values: [proximo, realizado]
          - { name: podcast, label: "Link do podcast", type: string }
          - name: galeria
            label: "Galeria de fotos"
            type: object
            list: true
            fields:
              - { name: foto, label: "Foto", type: image }
              - { name: legenda, label: "Legenda da foto", type: string, description: "Aparece no leitor de tela e na galeria ampliada" }
          - { name: video, label: "Link do vídeo (YouTube)", type: string }
          - { name: flourish, label: "Link do gráfico (Flourish)", type: string, description: "Cole o link do Flourish (public.flourish.studio ou flo.uri.sh)" }
          - { name: pdf, label: "Link do PDF", type: string, description: "Cole o link de um PDF já hospedado (Google Drive, upload via Media, etc)" }
          - { name: destaque, label: "Aparece em destaque?", type: boolean, default: false }
          - { name: destaque_ordem, label: "Ordem no destaque (1–3 aparecem na Home)", type: number }
          - { name: body, label: "Descrição", type: rich-text }

      - name: publicacoes
        label: Produções
        type: collection
        path: content/publicacoes
        operations:
          delete: false
        fields:
          - { name: title, label: "Título", type: string }
          - { name: ano, label: "Ano", type: number }
          - name: tipo
            label: "Tipo"
            type: select
            options:
              values: [academico, livro, midia]
          - { name: autores, label: "Autores", type: string }
          - { name: veiculo, label: "Veículo/Editora", type: string }
          - { name: link, label: "Link", type: string }
          - { name: description, label: "Resumo", type: text }
          - { name: foto, label: "Foto (opcional)", type: image }
          - name: galeria
            label: "Galeria de fotos"
            type: object
            list: true
            fields:
              - { name: foto, label: "Foto", type: image }
              - { name: legenda, label: "Legenda da foto", type: string, description: "Aparece no leitor de tela e na galeria ampliada" }
          - { name: video, label: "Link do vídeo (YouTube)", type: string }
          - { name: flourish, label: "Link do gráfico (Flourish)", type: string, description: "Cole o link do Flourish (public.flourish.studio ou flo.uri.sh)" }
          - { name: pdf, label: "Link do PDF", type: string, description: "Cole o link de um PDF já hospedado (Google Drive, upload via Media, etc)" }
          - { name: destaque, label: "Aparece em destaque?", type: boolean, default: false }
          - { name: destaque_ordem, label: "Ordem no destaque (1–3 aparecem na Home)", type: number }

  - name: institucional
    label: "Institucional"
    type: group
    items:
      - name: membros
        label: Pesquisadores
        type: collection
        path: content/membros
        operations:
          delete: false
        fields:
          - { name: title, label: "Nome", type: string }
          - { name: sigla, label: "Sigla (avatar)", type: string, description: "2–3 letras" }
          - { name: instituicao, label: "Instituição", type: string }
          - name: area
            label: "Área de pesquisa"
            type: string
            list: true
          - { name: foto, label: "Foto", type: image }
          - { name: link, label: "Link (Lattes, opcional)", type: string }

      - name: sobre
        label: "Página Sobre"
        type: file
        path: content/sobre/_index.md
        operations:
          delete: false
        fields:
          - { name: body, label: "Conteúdo", type: rich-text }

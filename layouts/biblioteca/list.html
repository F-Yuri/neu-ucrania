{{ define "main" }}
<div style="background:var(--fundo-neutro);padding:24px 0 64px;">
  <div class="neu-container">

    <!-- HERO (sem card, mesmo padrão das outras listagens) -->
    <div style="padding:8px 0 4px;max-width:640px;">
      <div class="neu-eyebrow neu-eyebrow--on-branco" style="margin-bottom:8px;">{{ i18n "page_biblioteca_eyebrow" }}</div>
      <h1 class="neu-h1" style="color:var(--tinta);margin-bottom:10px;">{{ i18n "page_biblioteca_title" }}</h1>
      <p style="font-family:var(--font-body);font-size:15px;line-height:1.6;color:var(--texto-corpo);margin:0;">{{ i18n "page_biblioteca_desc" }}</p>
    </div>

    <!-- LISTAS DE LINKS, por categoria (dado real do site) -->
    <div style="display:flex;flex-direction:column;gap:32px;padding:28px 0 4px;">

      {{ range .Params.categorias }}
      <div>
        <div class="neu-eyebrow neu-eyebrow--on-branco" style="margin-bottom:12px;">{{ .titulo }}</div>
        <div style="background:var(--branco);border:1px solid var(--borda-padrao);border-radius:var(--radius-card);overflow:hidden;">
          {{ $links := .links }}
          {{ range $i, $l := $links }}
          <a href="{{ $l.url }}" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;{{ if ne $i (sub (len $links) 1) }}border-bottom:1px solid var(--borda-sutil);{{ end }}">
            <div><div style="font-family:var(--font-display);font-size:14.5px;font-weight:700;color:var(--tinta);margin-bottom:3px;">{{ $l.label }} ↗</div><div style="font-family:var(--font-body);font-size:12.5px;color:var(--texto-secundario);">{{ $l.desc }}</div></div>
            <span style="color:var(--texto-secundario);flex-shrink:0;">→</span>
          </a>
          {{ end }}
        </div>
      </div>
      {{ end }}

    </div>

  </div>
</div>
{{ end }}
